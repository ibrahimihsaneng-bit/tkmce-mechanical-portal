name: Deploy MECH TKMCE Academic Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Core Academic Assets
        run: |
          node -e "
          const fs = require('fs');
          console.log('Validating MECH TKMCE files...');
          if (!fs.existsSync('index.html')) throw new Error('index.html missing');
          if (!fs.existsSync('mech_core_data.js')) throw new Error('mech_core_data.js missing');
          if (!fs.existsSync('mech_app.js')) throw new Error('mech_app.js missing');
          if (!fs.existsSync('tkm_syllabus_2024.pdf')) throw new Error('Syllabus PDF missing');
          console.log('Validation successful! All core academic assets intact.');
          "

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
