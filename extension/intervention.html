<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Remember your goal | MECH TKMCE</title>
  <style>
    body {
      margin: 0;
      background: #142D28;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    main {
      max-width: 440px;
      width: 100%;
      display: grid;
      gap: 20px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #B9D3C2;
      font-weight: 700;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 1px;
      font-weight: 700;
      color: #B9D3C2;
      border: 1px solid #507265;
      border-radius: 20px;
      padding: 4px 12px;
      justify-self: center;
    }
    h1 {
      font-size: 2rem;
      margin: 0;
    }
    p {
      color: #B9D3C2;
      font-size: 0.95rem;
      margin: 0;
    }
    .goal-box {
      background: #24473b;
      padding: 16px;
      border-radius: 12px;
    }
    .btn {
      display: block;
      background: #C6E4CD;
      color: #142D28;
      padding: 14px;
      border-radius: 9px;
      font-weight: 700;
      text-decoration: none;
      font-size: 1rem;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 13px;
    }
    .links a {
      color: #B9D3C2;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">MECH TKMCE / FOCUS STUDIO</div>
    <div class="badge">DISTRACTION INTERVENTION</div>
    <div style="font-size: 44px; color: #B9D3C2;">◎</div>
    <h1>Remember your goal.</h1>
    <p>This distraction was paused by your active study session on MECH TKMCE.</p>
    <div class="goal-box">
      <div class="eyebrow" style="font-size: 10px; margin-bottom: 4px;">TARGET GOAL</div>
      <h3 style="margin: 0; font-size: 1.1rem;">Understand conduction and solve 3 problems</h3>
    </div>
    <a href="https://mechtkmce.vercel.app/#focus" class="btn" target="_blank">Return to Study &rarr;</a>
    <div class="links">
      <a href="https://mechtkmce.vercel.app/#dashboard">Emergency Access</a>
    </div>
  </main>
</body>
</html>
