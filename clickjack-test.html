<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ക്ലിക്ക്ജാക്കിംഗ് സുരക്ഷാ ടെസ്റ്റ് - Vyapar Shiksha</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 25px; background: #0f172a; color: #f8fafc; text-align: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 900px; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 12px; }
        .status-box { background: #7f1d1d; color: #fecaca; padding: 14px; border-radius: 8px; font-weight: 600; margin: 15px 0; border: 1px solid #dc2626; }
        iframe { border: 2px dashed #f87171; border-radius: 8px; width: 100%; height: 500px; margin-top: 15px; background: #ffffff; }
        .note { font-size: 14px; color: #94a3b8; margin-top: 15px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔒 ക്ലിക്ക്ജാക്കിംഗ് പെനട്രേഷൻ ടെസ്റ്റ് (Security Test)</h1>
        <div class="status-box">
            പരിശോധന: ഒരു വ്യാജ പേജിൽ vyapar-shiksha.vercel.app ഉൾപ്പെടുത്താൻ ശ്രമിക്കുന്നു
        </div>
        <p class="note">
            നമ്മൾ നൽകിയ <strong>X-Frame-Options: DENY</strong> സുരക്ഷാ കവചം കാരണം താഴെയുള്ള ഫ്രെയിമിൽ വെബ്സൈറ്റ് ലോഡ് ആകില്ല. ബ്രൗസർ അത് തടഞ്ഞ് <em>"refused to connect"</em> എന്ന് കാണിക്കും:
        </p>
        <iframe src="https://vyapar-shiksha.vercel.app"></iframe>
    </div>
</body>
</html>
